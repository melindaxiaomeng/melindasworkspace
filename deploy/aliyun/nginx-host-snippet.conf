# 看板反代配置 —— 放到现有 nginx 的 conf.d 即可（与其他项目完全独立）
# 用法：sudo cp 本文件 /etc/nginx/conf.d/kanban-pool.conf && sudo nginx -t && sudo systemctl reload nginx
# 前提：容器已按 docker-compose 绑定 127.0.0.1:3777，本机回环反代，端口不外露
# 前置：DNS 加一条 A 记录  workspace.teensing.com  →  ECS 公网 IP

# HTTP：先跑通用这段；证书就绪后建议切到下方 443（并把 80 改成 301 跳转）
server {
    listen 80;
    server_name workspace.teensing.com;

    location / {
        proxy_pass http://127.0.0.1:3777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

