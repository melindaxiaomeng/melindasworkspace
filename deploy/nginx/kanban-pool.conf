# 用法：放到 /etc/nginx/sites-available/ 软链到 sites-enabled/，或 conf.d/
# 推荐用子域名（前端资源用的是绝对路径 /，子路径挂载需改前端 base，故优先子域名）

server {
    listen 80;
    server_name pool.example.com;   # 改成你的域名，证书走 443 时把 listen 改为 443 ssl

    # 大文件/长轮询可酌情调
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3777;   # 与 HOST/PORT 对应，应用仅监听 127.0.0.1
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：nginx 层再叠一道 basic auth（与 API_TOKEN 二选一或叠加）
    # auth_basic "Kanban Pool";
    # auth_basic_user_file /etc/nginx/.htpasswd_kanban;
    # 生成密码：htpasswd -c /etc/nginx/.htpasswd_kanban 你的用户名
}

